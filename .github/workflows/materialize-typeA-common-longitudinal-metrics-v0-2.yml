name: Materialize Type-A common longitudinal metrics v0.2

on:
  push:
    paths:
      - 'scripts/build_typeA_common_longitudinal_metrics_v0_2.py'
      - '.github/workflows/materialize-typeA-common-longitudinal-metrics-v0-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build corrected common metrics
        run: python scripts/build_typeA_common_longitudinal_metrics_v0_2.py
      - name: QA
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/typeA/typeA_common_longitudinal_metrics_v0_2.json',encoding='utf-8'))
          k=d['cohorts']['khan_2005_korea_leaders60_person57']['t20']
          assert k['assessable_n']==52
          assert k['scope_ge2_n']==43
          assert k['major_ge3_n']==26
          assert k['apex_eq4_n']==10
          assert abs(k['major_ge3_rate']-0.5)<1e-12
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/typeA/typeA_common_longitudinal_metrics_v0_2.json state/typeA_common_longitudinal_metrics_freeze_v0_2.json
          if ! git diff --cached --quiet; then
            git commit -m "Correct Type-A common longitudinal metrics v0.2"
            git push
          fi
