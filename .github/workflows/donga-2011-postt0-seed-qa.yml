name: Dong-A 2011 Post-T0 Seed QA

on:
  push:
    paths:
      - 'scripts/build_donga_2011_post_t0_seed.py'
      - 'scripts/build_donga_2011_post_t0_partial_master.py'
      - 'research/donga_2011_post_t0_repeat_cutoff_audit_v0_1.json'
      - 'research/donga_2011_post_t0_new_audit_batch1_v0_1.json'
      - 'research/donga_2011_post_t0_new_audit_batch2_v0_1.json'
      - 'research/donga_2011_post_t0_new_audit_batch3_v0_1.json'
      - 'research/donga_2011_post_t0_new_audit_batch4_v0_1.json'
      - 'data/typeA/donga_2011_t0_roles_v0_1.json'
      - '.github/workflows/donga-2011-postt0-seed-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frozen 2010 T0 and baseline
        run: |
          python scripts/build_donga_2010_t0_snapshot_scope.py
          python scripts/build_donga_2010_t0_snapshot_scope_v0_2.py
          python scripts/build_donga_2010_t0_snapshot_scope_v0_3.py
          python scripts/build_donga_2010_t0_snapshot_scope_v0_4.py
          python scripts/build_donga_2010_t0_snapshot_scope_v1_1.py
          python scripts/build_donga_2010_t0_snapshot_scope_v1_2.py
          python scripts/build_donga_2010_t0_snapshot_scope_v1_3.py
          python scripts/build_donga_2010_baseline_peak_v1_1.py
          python scripts/build_donga_2010_baseline_peak_v1_2.py
          python scripts/build_donga_2010_baseline_peak_v1_3.py
          python scripts/build_donga_2010_baseline_peak_v1_4.py
      - name: Build final 2010 post-T0 master
        run: python scripts/build_donga_2010_post_t0_peak_master.py
      - name: Build audited 2011 T0 and baseline v1.0
        run: |
          python scripts/build_donga_2011_t0_snapshot_scope_v0_1.py
          python scripts/build_donga_2011_t0_snapshot_scope_v0_2.py
          python scripts/build_donga_2011_t0_snapshot_scope_v0_3.py
          python scripts/build_donga_2011_baseline_peak_v0_1.py
          python scripts/build_donga_2011_baseline_peak_v0_2.py
          python scripts/build_donga_2011_baseline_peak_v0_3.py
          python scripts/build_donga_2011_baseline_peak_v0_4.py
          python scripts/build_donga_2011_baseline_peak_v0_5.py
          python scripts/build_donga_2011_baseline_peak_v1_0.py
      - name: Build 2011 post-T0 triage seed
        run: python scripts/build_donga_2011_post_t0_seed.py
      - name: QA seed
        run: |
          python - <<'PY'
          import json
          q=json.load(open('analysis/donga_2011_post_t0_seed_v0_2.json',encoding='utf-8'))['qa']
          print(json.dumps(q,ensure_ascii=False,indent=2))
          assert q['total']==100 and q['repeat_n']==38 and q['new_2011_n']==62
          assert q['seed_status_counts']=={
              'repeat_safe_post2011_inheritance_candidate':34,
              'new_2011_manual_audit_required':62,
              'repeat_cutoff_reaudit_resolved':4,
          }
          assert q['repeat_resolved_n']==38 and q['repeat_reaudit_pending_n']==0
          PY
      - name: Build partial 2011 post-T0 master with new-entrant batches 1-4
        run: python scripts/build_donga_2011_post_t0_partial_master.py
      - name: QA partial master
        run: |
          python - <<'PY'
          import json
          d=json.load(open('analysis/donga_2011_post_t0_partial_master_v0_4.json',encoding='utf-8'))
          q=d['qa']
          print(json.dumps(q,ensure_ascii=False,indent=2))
          assert q['total']==100
          assert q['assessed_n']==78
          assert q['pending_n']==22
          assert q['repeat_assessed_n']==38
          assert q['new_assessed_n']==40
          assert len(q['pending_names'])==22
          batches=q['new_audit_batch_names']
          assert len(batches)==4 and all(len(v)==10 for v in batches.values())
          assert q['identity_anchor_validated_n']==20
          expected_anchor_names={
            '김선욱','김승환','박형주','석지영','이국종','변대규','남민우','황철주','장하석','함돈희',
            '박상일','이창준','김상욱','이수만','이불','손영래','권구훈','김은성','하정우','양윤선'
          }
          assert set(q['identity_anchor_validated_names'])==expected_anchor_names
          row={p['name']:p for p in d['people']}
          assert row['김정주']['exposure_truncated_by_death'] is True
          assert row['김정주']['death_year']==2022
          assert row['손흥민']['post2011_peak_score']==4
          assert row['김선욱']['t0_identity_anchor']['t0_role_official_2011']=='피아니스트'
          assert '아태이론물리센터' in row['김승환']['t0_identity_anchor']['t0_role_official_2011']
          assert row['김상욱']['t0_identity_anchor']['t0_role_official_2011']=='KAIST 신소재공학과 교수'
          assert row['박상일']['t0_identity_anchor']['t0_role_official_2011']=='파크시스템스 대표'
          assert row['양윤선']['t0_identity_anchor']['t0_role_official_2011']=='메디포스트 대표'
          assert row['양윤선']['post2011_peak_score']==2
          assert row['이창준']['post2011_peak_score']==3
          PY
