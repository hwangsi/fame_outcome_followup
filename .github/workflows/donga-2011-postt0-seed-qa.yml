name: Dong-A 2011 Post-T0 Seed QA

on:
  push:
    paths:
      - 'scripts/build_donga_2011_post_t0_seed.py'
      - 'scripts/build_donga_2011_post_t0_partial_master.py'
      - 'scripts/build_donga_2011_post_t0_master.py'
      - 'scripts/analyze_donga_2011_repeat_predictive_value.py'
      - 'scripts/build_donga_2010_2011_two_wave_master.py'
      - 'scripts/build_typeA_common_master_v0_2.py'
      - 'scripts/build_typeA_cross_cohort_comparison_v0_3.py'
      - 'research/donga_2011_post_t0_repeat_cutoff_audit_v0_1.json'
      - 'research/donga_2011_post_t0_new_audit_batch1_v0_1.json'
      - 'research/donga_2011_post_t0_new_audit_batch2_v0_1.json'
      - 'research/donga_2011_post_t0_new_audit_batch3_v0_1.json'
      - 'research/donga_2011_post_t0_new_audit_batch4_v0_1.json'
      - 'research/donga_2011_post_t0_new_audit_batch5_v0_1.json'
      - 'research/donga_2011_post_t0_new_audit_batch6_v0_1.json'
      - 'data/typeA/donga_2011_t0_roles_v0_1.json'
      - 'data/typeA/newsmaker_2003_outcomes_v0_3.json'
      - 'data/typeA/h21_2004_outcomes_v0_1.json'
      - '.github/workflows/donga-2011-postt0-seed-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frozen 2010 T0 and baseline
        run: |
          python scripts/build_donga_2010_t0_snapshot_scope.py
          python scripts/build_donga_2010_t0_snapshot_scope_v0_2.py
          python scripts/build_donga_2010_t0_snapshot_scope_v0_3.py
          python scripts/build_donga_2010_t0_snapshot_scope_v0_4.py
          python scripts/build_donga_2010_t0_snapshot_scope_v1_1.py
          python scripts/build_donga_2010_t0_snapshot_scope_v1_2.py
          python scripts/build_donga_2010_t0_snapshot_scope_v1_3.py
          python scripts/build_donga_2010_baseline_peak_v1_1.py
          python scripts/build_donga_2010_baseline_peak_v1_2.py
          python scripts/build_donga_2010_baseline_peak_v1_3.py
          python scripts/build_donga_2010_baseline_peak_v1_4.py
      - name: Build final 2010 post-T0 master
        run: python scripts/build_donga_2010_post_t0_peak_master.py
      - name: Build audited 2011 T0 and baseline v1.0
        run: |
          python scripts/build_donga_2011_t0_snapshot_scope_v0_1.py
          python scripts/build_donga_2011_t0_snapshot_scope_v0_2.py
          python scripts/build_donga_2011_t0_snapshot_scope_v0_3.py
          python scripts/build_donga_2011_baseline_peak_v0_1.py
          python scripts/build_donga_2011_baseline_peak_v0_2.py
          python scripts/build_donga_2011_baseline_peak_v0_3.py
          python scripts/build_donga_2011_baseline_peak_v0_4.py
          python scripts/build_donga_2011_baseline_peak_v0_5.py
          python scripts/build_donga_2011_baseline_peak_v1_0.py
      - name: Build 2011 post-T0 triage seed
        run: python scripts/build_donga_2011_post_t0_seed.py
      - name: QA seed
        run: |
          python - <<'PY'
          import json
          q=json.load(open('analysis/donga_2011_post_t0_seed_v0_2.json',encoding='utf-8'))['qa']
          assert q['total']==100 and q['repeat_n']==38 and q['new_2011_n']==62
          assert q['repeat_resolved_n']==38 and q['repeat_reaudit_pending_n']==0
          PY
      - name: Rebuild pre-final partial master regression checkpoint
        run: python scripts/build_donga_2011_post_t0_partial_master.py
      - name: QA 88-of-100 checkpoint
        run: |
          python - <<'PY'
          import json
          q=json.load(open('analysis/donga_2011_post_t0_partial_master_v0_5.json',encoding='utf-8'))['qa']
          assert q['assessed_n']==88 and q['pending_n']==12
          assert q['identity_anchor_validated_n']==30
          PY
      - name: Build final 2011 post-T0 master and metrics
        run: python scripts/build_donga_2011_post_t0_master.py
      - name: QA final master and metrics
        run: |
          python - <<'PY'
          import json
          d=json.load(open('analysis/donga_2011_post_t0_master_v1_0.json',encoding='utf-8'))
          m=json.load(open('analysis/donga_2011_post_t0_metrics_v1_0.json',encoding='utf-8'))
          q=d['qa']
          assert q['total']==100 and q['adjudicated_n']==100 and q['scored_n']==99
          assert q['not_assessable_n']==1 and q['pending_n']==0 and q['not_assessable_names']==['신준호']
          assert q['repeat_n']==38 and q['new_entrant_n']==62 and q['identity_anchor_validated_n']==42
          row={p['name']:p for p in d['people']}
          assert row['신준호']['post2011_peak_score'] is None
          assert row['김선욱']['t0_identity_anchor']['t0_role_official_2011']=='피아니스트'
          assert row['김가영']['t0_identity_anchor']['t0_role_official_2011']=='지리산친환경농상물유통 대표'
          assert row['전혜경']['t0_identity_anchor']['t0_role_official_2011']=='유니세프 Senior Advisor'
          assert m['primary_full_cohort_conservative']['denominator']==100
          assert m['sensitivity_assessable_only']['denominator']==99
          PY
      - name: Analyze prospective repeat-selection predictive value
        run: python scripts/analyze_donga_2011_repeat_predictive_value.py
      - name: QA repeat-selection analysis
        run: |
          python - <<'PY'
          import json
          a=json.load(open('analysis/donga_2011_repeat_predictive_value_v1_0.json',encoding='utf-8'))
          s=a['baseline_stratified_cmh_assessable_only']
          assert a['population']=={'total':100,'repeat':38,'new':62,'assessable':99,'new_assessable':61}
          assert set(s)=={'major','apex','advanced'}
          assert s['apex']['mh_common_or'] > 8
          assert s['apex']['exact_conditional']['exact_two_sided_p'] < 0.05
          assert s['major']['exact_conditional']['exact_two_sided_p'] > 0.05
          assert s['advanced']['exact_conditional']['exact_two_sided_p'] > 0.05
          PY
      - name: Build Dong-A 2010-2011 two-wave placement/person master
        run: python scripts/build_donga_2010_2011_two_wave_master.py
      - name: QA two-wave master
        run: |
          python - <<'PY'
          import json
          d=json.load(open('analysis/donga_2010_2011_two_wave_master_v0_1.json',encoding='utf-8'))
          q=d['qa']
          f=json.load(open('state/donga_2010_2011_two_wave_freeze_v0_1.json',encoding='utf-8'))
          assert q['placements_n']==200
          assert q['unique_persons_n']==162
          assert q['groups']=={'2010_only':62,'repeat_2010_2011':38,'2011_new':62}
          assert q['repeat_intersection_n']==38
          assert len(d['placements'])==200 and len(d['people'])==162
          assert f['population']=={'placements':200,'unique_persons':162,'groups':{'2010_only':62,'repeat_2010_2011':38,'2011_new':62}}
          rep=[p for p in d['people'] if p['group']=='repeat_2010_2011']
          assert len(rep)==38 and all(p['placement_count']==2 for p in rep)
          assert all(p['placement_count']==1 for p in d['people'] if p['group']!='repeat_2010_2011')
          PY
      - name: Persist two-wave freeze and result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/donga_2010_2011_two_wave_freeze_v0_1.json state/donga_2010_2011_two_wave_result_v0_1.md
          if ! git diff --cached --quiet; then
            git commit -m "Freeze Dong-A 2010-2011 two-wave summary"
            git push
          fi
      - name: Build identity-safe Type-A common master v0.2
        run: python scripts/build_typeA_common_master_v0_2.py
      - name: QA Type-A common master v0.2
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/typeA/typeA_common_master_v0_2.json',encoding='utf-8'))
          m=json.load(open('data/typeA/typeA_common_metrics_v0_2.json',encoding='utf-8'))
          f=json.load(open('state/typeA_common_master_freeze_v0_2.json',encoding='utf-8'))
          q=d['qa']
          print(json.dumps({'common_qa':q,'by_unit':m['by_cohort_unit'],'person_first':m['person_first_selection_descriptive']},ensure_ascii=False,indent=2))
          assert q['placements']==225
          assert q['unique_people']==179
          assert q['repeated_person_n']==43
          assert q['placement_count_distribution']=={'1':136,'2':40,'3':3}
          assert q['triple_selected_names']==['안철수','유시민','이재용']
          assert q['same_name_candidates_n']==43
          assert q['cohort_units']==5
          assert q['not_assessable_placements']==1
          assert f['qa']==q
          u=m['by_cohort_unit']
          assert (u['newsmaker_2003_politics_top10']['n'],u['newsmaker_2003_economy_top5']['n'])==(10,5)
          assert u['h21_2004_politics_top10']['n']==10
          assert u['donga_2010_2020_100']['n']==100
          assert u['donga_2011_10yr_100']['n']==100
          assert (u['donga_2011_10yr_100']['major_n'],u['donga_2011_10yr_100']['apex_n'],u['donga_2011_10yr_100']['advanced_n'])==(90,12,36)
          people={p['name']:p for p in d['people']}
          assert people['안철수']['placement_count']==3
          assert people['유시민']['placement_count']==3
          assert people['이재용']['placement_count']==3
          assert people['박근혜']['placement_count']==2
          PY
      - name: Build cross-cohort comparison v0.3
        run: python scripts/build_typeA_cross_cohort_comparison_v0_3.py
      - name: QA cross-cohort report
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('analysis/typeA_cross_cohort_comparison_v0_3.md')
          s=p.read_text(encoding='utf-8')
          assert '225 placements' in s
          assert '179' in s
          assert '안철수' in s and '유시민' in s and '이재용' in s
          assert 'not_assessable' in s
          PY
      - name: Persist Type-A common master v0.2 and v0.3 report
        run: |
          git add data/typeA/typeA_common_master_v0_2.json data/typeA/typeA_common_master_v0_2.csv data/typeA/typeA_common_metrics_v0_2.json state/typeA_common_master_freeze_v0_2.json analysis/typeA_cross_cohort_comparison_v0_3.md
          if ! git diff --cached --quiet; then
            git commit -m "Freeze Type-A common master v0.2 and cross-cohort v0.3"
            git push
          fi
