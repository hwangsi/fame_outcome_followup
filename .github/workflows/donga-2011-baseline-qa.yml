name: Dong-A 2011 Baseline QA

on:
  push:
    paths:
      - 'research/donga_2011_prior_career_audit_v0_*.json'
      - 'scripts/build_donga_2011_baseline_peak_v0_*.py'
      - 'scripts/build_donga_2011_baseline_peak_v1_0.py'
      - 'scripts/build_donga_2011_t0_snapshot_scope_v0_*.py'
      - 'scripts/build_donga_2010_t0_snapshot_scope*.py'
      - 'scripts/build_donga_2010_baseline_peak_v1_*.py'
      - 'data/typeA/donga_2011_*'
      - 'state/donga_2011_*'
      - '.github/workflows/donga-2011-baseline-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frozen 2010 baseline prerequisite
        run: |
          python scripts/build_donga_2010_t0_snapshot_scope.py
          python scripts/build_donga_2010_t0_snapshot_scope_v0_2.py
          python scripts/build_donga_2010_t0_snapshot_scope_v0_3.py
          python scripts/build_donga_2010_t0_snapshot_scope_v0_4.py
          python scripts/build_donga_2010_t0_snapshot_scope_v1_1.py
          python scripts/build_donga_2010_t0_snapshot_scope_v1_2.py
          python scripts/build_donga_2010_t0_snapshot_scope_v1_3.py
          python scripts/build_donga_2010_baseline_peak_v1_1.py
          python scripts/build_donga_2010_baseline_peak_v1_2.py
          python scripts/build_donga_2010_baseline_peak_v1_3.py
          python scripts/build_donga_2010_baseline_peak_v1_4.py
      - name: Build audited 2011 T0 and final baseline v1.0
        run: |
          python scripts/build_donga_2011_t0_snapshot_scope_v0_1.py
          python scripts/build_donga_2011_t0_snapshot_scope_v0_2.py
          python scripts/build_donga_2011_t0_snapshot_scope_v0_3.py
          python scripts/build_donga_2011_baseline_peak_v0_1.py
          python scripts/build_donga_2011_baseline_peak_v0_2.py
          python scripts/build_donga_2011_baseline_peak_v0_3.py
          python scripts/build_donga_2011_baseline_peak_v0_4.py
          python scripts/build_donga_2011_baseline_peak_v0_5.py
          python scripts/build_donga_2011_baseline_peak_v1_0.py
      - name: QA
        run: |
          python - <<'PY'
          import json
          p='data/typeA/donga_2011_baseline_peak_through_t0_v1_0.json'
          d=json.load(open(p,encoding='utf-8'))
          qa=d['qa']
          print(json.dumps(qa,ensure_ascii=False,indent=2))
          assert qa['total']==100 and qa['unique_names']==100
          assert qa['repeat_checked_n']==38
          assert qa['new_person_total_n']==62
          assert qa['new_person_prior_audited_n']==62
          assert qa['new_person_prior_audit_pending_n']==0
          assert qa['all_prior_career_audits_complete'] is True
          assert qa['baseline_greater_than_t0_n']==6
          assert set(qa['baseline_greater_than_t0_names'])=={'백승헌','이창준','이연희','이상이','이국종','이자람'}
          assert qa['this_pass_corrected_n']==3
          assert set(qa['this_pass_corrected_names'])=={'이상이','이국종','이자람'}
          assert qa['score_counts']=={'2':38,'3':57,'4':5}
          assert qa['mean_baseline']==2.67
          by={x['name']:x for x in d['people']}
          assert by['백승헌']['baseline_peak_through_t0']==3
          assert by['이창준']['baseline_peak_through_t0']==3
          assert by['이연희']['baseline_peak_through_t0']==3
          assert by['이상이']['baseline_peak_through_t0']==3
          assert by['이국종']['baseline_peak_through_t0']==3
          assert by['이자람']['baseline_peak_through_t0']==3
          assert not any(x.get('needs_new_person_prior_career_audit') for x in d['people'])
          PY
