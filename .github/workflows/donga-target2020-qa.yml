name: Dong-A Target2020 QA

on:
  push:
    paths:
      - 'scripts/build_donga_2010_target2020_master.py'
      - 'scripts/analyze_donga_2010_target2020.py'
      - 'scripts/build_donga_2010_t0_snapshot_scope.py'
      - 'scripts/build_donga_2010_t0_snapshot_scope_v0_2.py'
      - 'scripts/build_donga_2010_t0_snapshot_scope_v0_3.py'
      - 'scripts/build_donga_2010_t0_snapshot_scope_v0_4.py'
      - 'scripts/build_donga_2010_t0_snapshot_scope_v1_1.py'
      - 'scripts/build_donga_2010_t0_snapshot_scope_v1_2.py'
      - 'scripts/build_donga_2010_t0_snapshot_scope_v1_3.py'
      - 'scripts/build_donga_2010_baseline_peak_v1_1.py'
      - 'scripts/build_donga_2010_baseline_peak_v1_2.py'
      - 'scripts/build_donga_2010_baseline_peak_v1_3.py'
      - 'scripts/build_donga_2010_baseline_peak_v1_4.py'
      - 'scripts/analyze_donga_2010_post_t0_peak.py'
      - 'scripts/build_donga_2010_post_t0_peak_master.py'
      - 'scripts/analyze_donga_2010_repeat_selection.py'
      - 'scripts/analyze_donga_2010_repeat_stratified.py'
      - 'scripts/build_donga_2011_t0_snapshot_scope_v0_1.py'
      - 'scripts/build_donga_2011_t0_snapshot_scope_v0_2.py'
      - 'scripts/build_donga_2011_t0_snapshot_scope_v0_3.py'
      - 'scripts/build_donga_2011_baseline_peak_v0_1.py'
      - 'scripts/build_typeA_common_master_v0_1.py'
      - 'data/typeA/donga_2010_*'
      - 'data/typeA/donga_2011_*'
      - 'data/typeA/newsmaker_2003_outcomes_v0_3.json'
      - 'data/typeA/h21_2004_outcomes_v0_1.json'
      - 'state/donga_2010_*'
      - '.github/workflows/donga-target2020-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frozen T0 scope chain through v1.3
        run: |
          python scripts/build_donga_2010_t0_snapshot_scope.py
          python scripts/build_donga_2010_t0_snapshot_scope_v0_2.py
          python scripts/build_donga_2010_t0_snapshot_scope_v0_3.py
          python scripts/build_donga_2010_t0_snapshot_scope_v0_4.py
          python scripts/build_donga_2010_t0_snapshot_scope_v1_1.py
          python scripts/build_donga_2010_t0_snapshot_scope_v1_2.py
          python scripts/build_donga_2010_t0_snapshot_scope_v1_3.py
      - name: Build final baseline peak through T0 v1.4
        run: |
          python scripts/build_donga_2010_baseline_peak_v1_1.py
          python scripts/build_donga_2010_baseline_peak_v1_2.py
          python scripts/build_donga_2010_baseline_peak_v1_3.py
          python scripts/build_donga_2010_baseline_peak_v1_4.py
      - name: Build canonical target2020 master and metrics
        run: |
          python scripts/build_donga_2010_target2020_master.py
          python scripts/analyze_donga_2010_target2020.py
      - name: Analyze final patched post-T0 peak batches
        run: python scripts/analyze_donga_2010_post_t0_peak.py
      - name: Build final post-T0 master and metrics v1.2
        run: python scripts/build_donga_2010_post_t0_peak_master.py
      - name: Build Type-A common master v0.1
        run: python scripts/build_typeA_common_master_v0_1.py
      - name: Analyze 2010-2011 repeat selection
        run: |
          python scripts/analyze_donga_2010_repeat_selection.py
          python scripts/analyze_donga_2010_repeat_stratified.py
      - name: Build Dong-A 2011 T0 and baseline pass 1
        run: |
          python scripts/build_donga_2011_t0_snapshot_scope_v0_1.py
          python scripts/build_donga_2011_t0_snapshot_scope_v0_2.py
          python scripts/build_donga_2011_t0_snapshot_scope_v0_3.py
          python scripts/build_donga_2011_baseline_peak_v0_1.py
      - name: Show final QA
        run: |
          wc -l data/typeA/donga_2010_t0_snapshot_scope_v1_3.csv
          wc -l data/typeA/donga_2010_baseline_peak_through_t0_v1_4.csv
          wc -l data/typeA/donga_2010_post_t0_peak_master_v1_2.csv
          wc -l data/typeA/donga_2011_t0_snapshot_scope_v0_3.csv
          wc -l data/typeA/donga_2011_baseline_peak_through_t0_v0_1.csv
          wc -l data/typeA/typeA_common_master_v0_1.csv
          python - <<'PY'
          import json
          t0=json.load(open('data/typeA/donga_2010_t0_snapshot_scope_v1_3.json',encoding='utf-8'))
          baseline=json.load(open('data/typeA/donga_2010_baseline_peak_through_t0_v1_4.json',encoding='utf-8'))
          working=json.load(open('data/typeA/donga_2010_post_t0_peak_analysis_working.json',encoding='utf-8'))
          pmaster=json.load(open('data/typeA/donga_2010_post_t0_peak_master_v1_2.json',encoding='utf-8'))
          metrics=json.load(open('data/typeA/donga_2010_post_t0_peak_metrics_v1_2.json',encoding='utf-8'))
          common=json.load(open('data/typeA/typeA_common_metrics_v0_1.json',encoding='utf-8'))
          repeat=json.load(open('analysis/donga_2010_repeat_selection_metrics_v0_1.json',encoding='utf-8'))
          strat=json.load(open('analysis/donga_2010_repeat_selection_stratified_v0_2.json',encoding='utf-8'))
          t011=json.load(open('data/typeA/donga_2011_t0_snapshot_scope_v0_3.json',encoding='utf-8'))
          b11=json.load(open('data/typeA/donga_2011_baseline_peak_through_t0_v0_1.json',encoding='utf-8'))
          print(json.dumps(t0['qa'],ensure_ascii=False,indent=2))
          print(json.dumps(baseline['qa'],ensure_ascii=False,indent=2))
          print(json.dumps(pmaster['qa'],ensure_ascii=False,indent=2))
          print(json.dumps(metrics['primary_full_cohort'],ensure_ascii=False,indent=2))
          print(json.dumps(common['qa'],ensure_ascii=False,indent=2))
          print(json.dumps(repeat['groups'],ensure_ascii=False,indent=2))
          print(json.dumps(strat,ensure_ascii=False,indent=2))
          print(json.dumps(t011['qa'],ensure_ascii=False,indent=2))
          print(json.dumps(b11['qa'],ensure_ascii=False,indent=2))
          assert t0['qa']['score_counts']=={'1':1,'2':48,'3':48,'4':3}
          assert baseline['qa']['score_counts']=={'1':1,'2':46,'3':50,'4':3}
          assert working['coverage']=={'rows':100,'assessed':100,'unresolved':0,'remaining_uncreated':0}
          assert pmaster['qa']['total']==100 and pmaster['qa']['assessed']==100 and pmaster['qa']['unresolved']==0
          assert pmaster['qa']['post_t0_score_counts']=={'2':29,'3':59,'4':12}
          assert metrics['primary_full_cohort']['major_leadership_precision']==0.71
          assert metrics['primary_full_cohort']['advanced_rate']==0.28
          assert common['qa']['placements']==125 and common['qa']['unique_people']==118 and common['qa']['repeated_person_n']==7
          assert repeat['repeat_n']==38 and repeat['single_2010_only_n']==62
          assert strat['strata']['2']['repeat_advanced_n']==5 and strat['strata']['2']['single_advanced_n']==13
          assert strat['strata']['3']['repeat_advanced_n']==6 and strat['strata']['3']['single_advanced_n']==3
          assert t011['qa']['total']==100 and t011['qa']['unique_names']==100 and t011['qa']['repeat_n']==38
          assert t011['qa']['score_counts']=={'2':44,'3':51,'4':5}
          assert t011['qa']['review_flagged_n']==0
          assert b11['qa']['total']==100 and b11['qa']['repeat_checked_n']==38 and b11['qa']['new_person_prior_audit_pending_n']==62
          assert b11['qa']['repeat_carried_higher_n']==0
          assert b11['qa']['score_counts']=={'2':44,'3':51,'4':5}
          PY
