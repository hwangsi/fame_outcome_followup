name: Dong-A Target2020 QA

on:
  push:
    paths:
      - 'scripts/build_donga_2010_target2020_master.py'
      - 'scripts/analyze_donga_2010_target2020.py'
      - 'scripts/build_donga_2010_t0_snapshot_scope.py'
      - 'scripts/build_donga_2010_t0_snapshot_scope_v0_2.py'
      - 'scripts/build_donga_2010_t0_snapshot_scope_v0_3.py'
      - 'scripts/build_donga_2010_t0_snapshot_scope_v0_4.py'
      - 'scripts/build_donga_2010_baseline_peak_v0_1.py'
      - 'scripts/analyze_donga_2010_t0_to_target2020_v0_2.py'
      - 'data/typeA/donga_2010_*'
      - 'state/donga_2010_*'
      - '.github/workflows/donga-target2020-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build T0 scope chain
        run: |
          python scripts/build_donga_2010_t0_snapshot_scope.py
          python scripts/build_donga_2010_t0_snapshot_scope_v0_2.py
          python scripts/build_donga_2010_t0_snapshot_scope_v0_3.py
          python scripts/build_donga_2010_t0_snapshot_scope_v0_4.py
      - name: Build baseline peak through T0
        run: python scripts/build_donga_2010_baseline_peak_v0_1.py
      - name: Build canonical target2020 master and metrics
        run: |
          python scripts/build_donga_2010_target2020_master.py
          python scripts/analyze_donga_2010_target2020.py
      - name: Show baseline QA
        run: |
          wc -l data/typeA/donga_2010_t0_snapshot_scope_v0_4.csv
          wc -l data/typeA/donga_2010_baseline_peak_through_t0_v0_1.csv
          python - <<'PY'
          import json
          t0=json.load(open('data/typeA/donga_2010_t0_snapshot_scope_v0_4.json',encoding='utf-8'))
          baseline=json.load(open('data/typeA/donga_2010_baseline_peak_through_t0_v0_1.json',encoding='utf-8'))
          master=json.load(open('data/typeA/donga_2010_target2020_master_v1_0.json',encoding='utf-8'))
          print(json.dumps(t0['qa'],ensure_ascii=False,indent=2))
          print(json.dumps(baseline['qa'],ensure_ascii=False,indent=2))
          print(json.dumps(master['qa'],ensure_ascii=False,indent=2))
          PY
